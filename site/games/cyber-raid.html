<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CYBER-RAID // LIQUID FIRE GOTHIC</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Orbitron:wght@400;700;900&display=swap');

        :root {
            --neon-magenta: #ff0055;
            --neon-cyan: #00f3ff;
            --neon-purple: #9d00ff;
            --neon-green: #00ff66;
            --neon-yellow: #ffea00;
            --liquid-orange: #ff5500;
            --glass-bg: rgba(8, 4, 15, 0.65);
            --glass-border: rgba(0, 243, 255, 0.35);
            --glass-glow: rgba(255, 0, 85, 0.25);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: #030108;
            color: #fff;
            font-family: 'Orbitron', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background-image: 
                radial-gradient(circle at 50% 20%, #2a004a 0%, #030108 85%),
                linear-gradient(rgba(255,0,85,0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0,243,255,0.04) 1px, transparent 1px);
            background-size: 100% 100%, 50px 50px, 50px 50px;
        }

        .game-wrapper {
            position: relative;
            display: flex;
            gap: 24px;
            padding: 24px;
            background: var(--glass-bg);
            backdrop-filter: blur(20px) saturate(200%);
            -webkit-backdrop-filter: blur(20px) saturate(200%);
            border: 1px solid var(--glass-border);
            border-radius: 28px;
            box-shadow: 
                0 35px 70px rgba(0, 0, 0, 0.85),
                inset 0 1px 0 rgba(255, 255, 255, 0.15),
                0 0 50px var(--glass-glow);
        }

        /* Glassmorphism Sidebar HUD */
        .hud-panel {
            width: 230px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 22px;
            background: rgba(14, 6, 26, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            backdrop-filter: blur(12px);
        }

        .hud-title {
            font-family: 'Cinzel', serif;
            font-size: 1.4rem;
            text-align: center;
            letter-spacing: 3px;
            color: #fff;
            text-shadow: 
                0 0 10px var(--neon-magenta),
                0 0 25px var(--liquid-orange);
            margin-bottom: 4px;
        }

        .hud-subtitle {
            font-size: 0.65rem;
            text-align: center;
            letter-spacing: 4px;
            color: var(--neon-cyan);
            margin-bottom: 22px;
            opacity: 0.85;
        }

        .stat-group {
            margin-bottom: 16px;
        }

        .stat-label {
            font-size: 0.65rem;
            color: rgba(255, 255, 255, 0.65);
            letter-spacing: 2px;
            margin-bottom: 5px;
            display: flex;
            justify-content: space-between;
        }

        .stat-value {
            font-size: 1.35rem;
            font-weight: 900;
            color: #fff;
            text-shadow: 0 0 12px var(--neon-cyan);
            font-family: 'Orbitron', sans-serif;
        }

        .gauge-container {
            width: 100%;
            height: 14px;
            background: rgba(0, 0, 0, 0.7);
            border: 1px solid rgba(0, 243, 255, 0.4);
            border-radius: 7px;
            overflow: hidden;
            padding: 2px;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.9);
        }

        .gauge-fill {
            height: 100%;
            width: 100%;
            background: linear-gradient(90deg, var(--liquid-orange), var(--neon-green));
            border-radius: 5px;
            box-shadow: 0 0 15px var(--neon-green);
            transition: width 0.1s linear, background 0.3s;
        }

        .controls-hint {
            font-size: 0.65rem;
            line-height: 1.6;
            color: rgba(255, 255, 255, 0.55);
            background: rgba(0, 0, 0, 0.4);
            padding: 12px;
            border-radius: 10px;
            border-left: 2px solid var(--neon-magenta);
        }

        .controls-hint span {
            color: var(--neon-cyan);
            font-weight: bold;
        }

        .canvas-container {
            position: relative;
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid rgba(255, 0, 85, 0.4);
            box-shadow: 
                0 0 25px rgba(0, 0, 0, 0.95),
                inset 0 0 20px rgba(0, 243, 255, 0.2);
        }

        canvas {
            display: block;
            background: #040208;
        }

        .overlay-screen {
            position: absolute;
            inset: 0;
            background: rgba(4, 2, 10, 0.9);
            backdrop-filter: blur(14px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
            padding: 30px;
            text-align: center;
        }

        .overlay-title {
            font-family: 'Cinzel', serif;
            font-size: 2.4rem;
            color: #fff;
            text-shadow: 0 0 20px var(--neon-magenta), 0 0 40px var(--liquid-orange);
            margin-bottom: 12px;
        }

        .overlay-desc {
            font-size: 0.8rem;
            color: var(--neon-cyan);
            margin-bottom: 30px;
            letter-spacing: 2px;
        }

        .btn-glow {
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            font-size: 0.95rem;
            letter-spacing: 3px;
            color: #fff;
            padding: 14px 36px;
            background: linear-gradient(135deg, rgba(255, 85, 0, 0.5), rgba(157, 0, 255, 0.5));
            border: 1px solid var(--neon-cyan);
            border-radius: 30px;
            cursor: pointer;
            backdrop-filter: blur(6px);
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.4);
            transition: all 0.2s ease;
        }

        .btn-glow:hover {
            transform: translateY(-2px) scale(1.04);
            box-shadow: 0 0 30px var(--neon-cyan), 0 0 15px var(--liquid-orange);
            background: linear-gradient(135deg, rgba(255, 85, 0, 0.8), rgba(157, 0, 255, 0.8));
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div class="game-wrapper">
        <div class="hud-panel">
            <div>
                <div class="hud-title">CYBER-RAID</div>
                <div class="hud-subtitle">LIQUID FIRE // GOTHIC</div>

                <div class="stat-group">
                    <div class="stat-label">PONTUAÇÃO</div>
                    <div id="scoreDisplay" class="stat-value">000000</div>
                </div>

                <div class="stat-group">
                    <div class="stat-label">NÍVEL / RIFT</div>
                    <div id="levelDisplay" class="stat-value" style="color: var(--neon-purple);">01</div>
                </div>

                <div class="stat-group">
                    <div class="stat-label">
                        <span>CYBER ENERGIA</span>
                        <span id="fuelNum">100%</span>
                    </div>
                    <div class="gauge-container">
                        <div id="fuelBar" class="gauge-fill"></div>
                    </div>
                </div>

                <div class="stat-group">
                    <div class="stat-label">ESCUDO MAGNÉTICO</div>
                    <div id="shieldDisplay" class="stat-value" style="color: var(--neon-yellow);">DESATIVADO</div>
                </div>

                <div class="stat-group">
                    <div class="stat-label">NAVES RESTANTES</div>
                    <div id="livesDisplay" class="stat-value" style="color: var(--neon-magenta);">3</div>
                </div>
            </div>

            <div class="controls-hint">
                <span>[←][→]</span> NAVEGAR<br>
                <span>[↑][↓]</span> VELOCIDADE<br>
                <span>[ESPAÇO]</span> PLASMA LÍQUIDO
            </div>
        </div>

        <div class="canvas-container">
            <canvas id="gameCanvas" width="500" height="660"></canvas>

            <div id="startOverlay" class="overlay-screen">
                <div class="overlay-title">LIQUID ABYSS</div>
                <div class="overlay-desc">NEON CYBERPUNK GOTHIC FLUID</div>
                <button id="startBtn" class="btn-glow">INICIAR MISSÃO</button>
            </div>

            <div id="gameOverOverlay" class="overlay-screen hidden">
                <div class="overlay-title" style="color: var(--neon-magenta);">SISTEMA DESTRUÍDO</div>
                <div class="overlay-desc" id="finalScoreText">PONTUAÇÃO FINAL: 0</div>
                <button id="restartBtn" class="btn-glow">REINICIALIZAR</button>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        class SoundSystem {
            constructor() {
                this.ctx = new (window.AudioContext || window.webkitAudioContext)();
            }

            playShoot() {
                if (this.ctx.state === 'suspended') this.ctx.resume();
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(900, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(120, this.ctx.currentTime + 0.14);
                gain.gain.setValueAtTime(0.25, this.ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0, this.ctx.currentTime + 0.14);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.14);
            }

            playExplosion() {
                if (this.ctx.state === 'suspended') this.ctx.resume();
                const bufSize = this.ctx.sampleRate * 0.4;
                const buffer = this.ctx.createBuffer(1, bufSize, this.ctx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufSize; i++) data[i] = Math.random() * 2 - 1;

                const noise = this.ctx.createBufferSource();
                noise.buffer = buffer;
                const filter = this.ctx.createBiquadFilter();
                filter.type = 'bandpass';
                filter.frequency.setValueAtTime(600, this.ctx.currentTime);
                filter.frequency.linearRampToValueAtTime(80, this.ctx.currentTime + 0.4);

                const gain = this.ctx.createGain();
                gain.gain.setValueAtTime(0.5, this.ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0, this.ctx.currentTime + 0.4);

                noise.connect(filter);
                filter.connect(gain);
                gain.connect(this.ctx.destination);
                noise.start();
            }

            playFuel() {
                if (this.ctx.state === 'suspended') this.ctx.resume();
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(350, this.ctx.currentTime);
                osc.frequency.linearRampToValueAtTime(700, this.ctx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0, this.ctx.currentTime + 0.1);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.1);
            }

            playShield() {
                if (this.ctx.state === 'suspended') this.ctx.resume();
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(300, this.ctx.currentTime);
                osc.frequency.linearRampToValueAtTime(1400, this.ctx.currentTime + 0.3);
                gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0, this.ctx.currentTime + 0.3);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.3);
            }
        }

        const audio = new SoundSystem();

        let gameRunning = false;
        let score = 0;
        let level = 1;
        let lives = 3;
        let fuel = 100;
        let shieldTime = 0;
        let speed = 3.8;
        let distanceY = 0;

        // Player maior e mais detalhado
        const player = {
            x: canvas.width / 2,
            y: canvas.height - 120,
            width: 44,
            height: 52,
            vx: 0
        };

        let bullets = [];
        let enemies = [];
        let fuelCells = [];
        let shieldItems = [];
        let mines = [];
        let bridges = [];
        let particles = [];
        let bankSpires = [];
        let ambientStars = [];

        // Inicializar partículas de fundo estelares/fluidadas
        for(let i=0; i<40; i++) {
            ambientStars.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                size: Math.random() * 2 + 1,
                speed: Math.random() * 0.5 + 0.2,
                color: Math.random() > 0.5 ? '#00f3ff' : '#ff0055'
            });
        }

        const keys = {};
        window.addEventListener('keydown', e => { 
            if(e.code === 'Space') e.preventDefault(); // Prevenir scroll da página
            keys[e.code] = true; 
        });
        window.addEventListener('keyup', e => { keys[e.code] = false; });

        // Cenário dinâmico que varia conforme o nível e o progresso (distância)
        function getRiverLimits(y) {
            const absoluteY = distanceY - y;
            // O formato do labirinto muda sutilmente de acordo com o nível atual
            const modFactor = 1 + (level * 0.15);
            const wave1 = Math.sin(absoluteY * 0.004 * modFactor) * (90 + level * 5);
            const wave2 = Math.cos(absoluteY * 0.009) * (45 + level * 3);
            const wave3 = Math.sin(absoluteY * 0.02) * 20;
            const center = (canvas.width / 2) + wave1 + wave2 + wave3;

            // Largura do rio diminui sutilmente a cada nível para maior desafio
            const currentWidth = Math.max(150, 280 - (level * 10));
            
            return {
                left: center - currentWidth / 2,
                right: center + currentWidth / 2
            };
        }

        let nextBridgeDistance = 1600;
        let lastSpawnY = 0;

        function spawnEntities() {
            if (distanceY - lastSpawnY > 100) {
                lastSpawnY = distanceY;
                const limits = getRiverLimits(-50);
                const spawnX = limits.left + 40 + Math.random() * (limits.right - limits.left - 80);

                const rand = Math.random();
                if (rand < 0.20) {
                    fuelCells.push({ x: spawnX, y: -50, width: 26, height: 36 });
                } else if (rand < 0.28) {
                    shieldItems.push({ x: spawnX, y: -50, size: 20 });
                } else if (rand < 0.44) {
                    mines.push({ x: spawnX, y: -50, radius: 14, pulse: 0 });
                } else if (rand < 0.82) {
                    // Tipos de inimigos maiores e mais elaborados
                    const type = Math.random() > 0.4 ? 'cyborg_fighter' : 'plasma_gargoyle';
                    enemies.push({
                        x: spawnX,
                        y: -50,
                        width: type === 'cyborg_fighter' ? 36 : 42,
                        height: type === 'cyborg_fighter' ? 34 : 38,
                        type: type,
                        vx: type === 'plasma_gargoyle' ? (Math.random() - 0.5) * 3.5 : (Math.random() - 0.5) * 1.5,
                        angle: 0
                    });
                }

                // Espirais e estruturas góticas líquidas nas margens
                if (Math.random() < 0.7) {
                    bankSpires.push({
                        side: 'left',
                        x: limits.left - 18 - Math.random() * 35,
                        y: -60,
                        height: 30 + Math.random() * 25,
                        color: Math.random() > 0.5 ? '#ff0055' : '#ff5500'
                    });
                }
                if (Math.random() < 0.7) {
                    bankSpires.push({
                        side: 'right',
                        x: limits.right + 18 + Math.random() * 35,
                        y: -60,
                        height: 30 + Math.random() * 25,
                        color: Math.random() > 0.5 ? '#00f3ff' : '#9d00ff'
                    });
                }
            }

            if (distanceY > nextBridgeDistance) {
                nextBridgeDistance += 2000 + (level * 250);
                bridges.push({ y: -60, height: 38, destroyed: false });
            }
        }

        function createExplosion(x, y, color) {
            for (let i = 0; i < 30; i++) {
                particles.push({
                    x, y,
                    vx: (Math.random() - 0.5) * 12,
                    vy: (Math.random() - 0.5) * 12,
                    life: 1.0,
                    color: color || '#ff5500',
                    size: Math.random() * 4 + 2
                });
            }
        }

        let lastShot = 0;
        function shoot() {
            const now = Date.now();
            if (now - lastShot > 140) { // Cadência melhorada
                // Tiro duplo de plasma líquido (estilo asas)
                bullets.push({ x: player.x - 10, y: player.y - 18, width: 6, height: 18 });
                bullets.push({ x: player.x + 10, y: player.y - 18, width: 6, height: 18 });
                audio.playShoot();
                lastShot = now;
            }
        }

        function resetPlayer() {
            const limits = getRiverLimits(player.y);
            player.x = (limits.left + limits.right) / 2;
            player.vx = 0;
            fuel = 100;
            shieldTime = 0;
        }

        function update() {
            if (!gameRunning) return;

            // Ajuste de velocidade com teclas
            if (keys['ArrowUp'] || keys['KeyW']) speed = 6.2;
            else if (keys['ArrowDown'] || keys['KeyS']) speed = 2.0;
            else speed = 3.8;

            distanceY += speed;

            if (shieldTime > 0) shieldTime -= 1;

            fuel -= 0.055 * (speed / 3.8);
            if (fuel <= 0) {
                handleDeath();
                return;
            }

            if (keys['ArrowLeft'] || keys['KeyA']) player.vx -= 0.75;
            if (keys['ArrowRight'] || keys['KeyD']) player.vx += 0.75;

            player.vx *= 0.8;
            player.x += player.vx;

            if (keys['Space']) shoot();

            // Colisão com as margens do rio
            const currentLimits = getRiverLimits(player.y);
            if (player.x - player.width / 2 < currentLimits.left || player.x + player.width / 2 > currentLimits.right) {
                if (shieldTime <= 0) {
                    createExplosion(player.x, player.y, '#00f3ff');
                    audio.playExplosion();
                    handleDeath();
                    return;
                } else {
                    player.x = Math.max(currentLimits.left + 20, Math.min(currentLimits.right - 20, player.x));
                }
            }

            spawnEntities();

            // Atualizar Projéteis
            for (let i = bullets.length - 1; i >= 0; i--) {
                let b = bullets[i];
                b.y -= 15;
                if (b.y < -20) { bullets.splice(i, 1); continue; }

                for (let br of bridges) {
                    if (!br.destroyed && Math.abs(b.y - br.y) < 22) {
                        br.destroyed = true;
                        score += 600;
                        level++;
                        createExplosion(b.x, br.y, '#ff5500');
                        audio.playExplosion();
                        bullets.splice(i, 1);
                        break;
                    }
                }
            }

            // Atualizar Inimigos
            for (let i = enemies.length - 1; i >= 0; i--) {
                let e = enemies[i];
                e.y += speed;
                e.x += e.vx;
                e.angle += 0.05;

                const eLimits = getRiverLimits(e.y);
                if (e.x < eLimits.left + 20 || e.x > eLimits.right - 20) e.vx *= -1;

                // Colisão Nave vs Inimigo
                if (Math.abs(player.x - e.x) < (player.width + e.width) / 2 - 6 &&
                    Math.abs(player.y - e.y) < (player.height + e.height) / 2 - 6) {
                    createExplosion(e.x, e.y, '#ff0055');
                    audio.playExplosion();
                    enemies.splice(i, 1);
                    if (shieldTime <= 0) {
                        handleDeath();
                        return;
                    }
                }

                // Colisão Tiro vs Inimigo
                for (let j = bullets.length - 1; j >= 0; j--) {
                    let b = bullets[j];
                    if (Math.abs(b.x - e.x) < e.width / 2 + 6 && Math.abs(b.y - e.y) < e.height / 2 + 6) {
                        createExplosion(e.x, e.y, '#ff0055');
                        audio.playExplosion();
                        score += e.type === 'cyborg_fighter' ? 120 : 200;
                        enemies.splice(i, 1);
                        bullets.splice(j, 1);
                        break;
                    }
                }

                if (e.y > canvas.height + 60) enemies.splice(i, 1);
            }

            // Atualizar Minas Flutuantes
            for (let i = mines.length - 1; i >= 0; i--) {
                let m = mines[i];
                m.y += speed;
                m.pulse += 0.1;

                if (Math.hypot(player.x - m.x, player.y - m.y) < m.radius + 14) {
                    createExplosion(m.x, m.y, '#ffea00');
                    audio.playExplosion();
                    mines.splice(i, 1);
                    if (shieldTime <= 0) {
                        handleDeath();
                        return;
                    }
                }

                for (let j = bullets.length - 1; j >= 0; j--) {
                    let b = bullets[j];
                    if (Math.hypot(b.x - m.x, b.y - m.y) < m.radius + 8) {
                        createExplosion(m.x, m.y, '#ffea00');
                        audio.playExplosion();
                        score += 75;
                        mines.splice(i, 1);
                        bullets.splice(j, 1);
                        break;
                    }
                }

                if (m.y > canvas.height + 60) mines.splice(i, 1);
            }

            // Atualizar Cânisteres de Combustível
            for (let i = fuelCells.length - 1; i >= 0; i--) {
                let f = fuelCells[i];
                f.y += speed;

                if (Math.abs(player.x - f.x) < (player.width + f.width) / 2 &&
                    Math.abs(player.y - f.y) < (player.height + f.height) / 2) {
                    fuel = Math.min(100, fuel + 1.2);
                    audio.playFuel();
                }

                for (let j = bullets.length - 1; j >= 0; j--) {
                    let b = bullets[j];
                    if (Math.abs(b.x - f.x) < f.width / 2 + 6 && Math.abs(b.y - f.y) < f.height / 2 + 6) {
                        createExplosion(f.x, f.y, '#00ff66');
                        audio.playExplosion();
                        score += 90;
                        fuelCells.splice(i, 1);
                        bullets.splice(j, 1);
                        break;
                    }
                }

                if (f.y > canvas.height + 60) fuelCells.splice(i, 1);
            }

            // Atualizar Cristais de Escudo
            for (let i = shieldItems.length - 1; i >= 0; i--) {
                let s = shieldItems[i];
                s.y += speed;

                if (Math.hypot(player.x - s.x, player.y - s.y) < s.size + 12) {
                    shieldTime = 360; // ~6 segundos
                    audio.playShield();
                    shieldItems.splice(i, 1);
                }

                if (s.y > canvas.height + 60) shieldItems.splice(i, 1);
            }

            // Atualizar Pontes
            for (let i = bridges.length - 1; i >= 0; i--) {
                let br = bridges[i];
                br.y += speed;

                if (!br.destroyed && Math.abs(player.y - br.y) < player.height / 2 + 12) {
                    if (shieldTime <= 0) {
                        createExplosion(player.x, player.y, '#ff0055');
                        audio.playExplosion();
                        handleDeath();
                        return;
                    }
                }

                if (br.y > canvas.height + 120) bridges.splice(i, 1);
            }

            // Espirais e detalhes das margens
            for (let i = bankSpires.length - 1; i >= 0; i--) {
                let sp = bankSpires[i];
                sp.y += speed;
                if (sp.y > canvas.height + 120) bankSpires.splice(i, 1);
            }

            // Estrelas de fundo
            for (let star of ambientStars) {
                star.y += speed * 0.3;
                if (star.y > canvas.height) star.y = 0;
            }

            // Partículas
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.life -= 0.025;
                if (p.life <= 0) particles.splice(i, 1);
            }

            score += Math.floor(speed * 0.25);
            updateHUD();
        }

        function handleDeath() {
            lives--;
            updateHUD();
            if (lives <= 0) {
                gameRunning = false;
                document.getElementById('finalScoreText').innerText = `PONTUAÇÃO FINAL: ${score.toString().padStart(6, '0')}`;
                document.getElementById('gameOverOverlay').classList.remove('hidden');
            } else {
                resetPlayer();
            }
        }

        function updateHUD() {
            document.getElementById('scoreDisplay').innerText = score.toString().padStart(6, '0');
            document.getElementById('levelDisplay').innerText = level.toString().padStart(2, '0');
            document.getElementById('livesDisplay').innerText = lives;
            
            const fuelBar = document.getElementById('fuelBar');
            const fuelNum = document.getElementById('fuelNum');
            const fuelPct = Math.max(0, Math.floor(fuel));
            fuelBar.style.width = fuelPct + '%';
            fuelNum.innerText = fuelPct + '%';

            const shieldDisp = document.getElementById('shieldDisplay');
            if (shieldTime > 0) {
                shieldDisp.innerText = `${Math.ceil(shieldTime / 60)}s`;
                shieldDisp.style.color = 'var(--neon-yellow)';
            } else {
                shieldDisp.innerText = 'DESATIVADO';
                shieldDisp.style.color = 'rgba(255,255,255,0.3)';
            }

            if (fuelPct < 25) {
                fuelBar.style.background = 'var(--neon-magenta)';
                fuelBar.style.boxShadow = '0 0 15px var(--neon-magenta)';
            } else {
                fuelBar.style.background = 'linear-gradient(90deg, var(--liquid-orange), var(--neon-green))';
                fuelBar.style.boxShadow = '0 0 15px var(--neon-green)';
            }
        }

        function render() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 1. Fundo estelar e ambientação líquida
            for (let star of ambientStars) {
                ctx.save();
                ctx.fillStyle = star.color;
                ctx.shadowBlur = 8;
                ctx.shadowColor = star.color;
                ctx.fillRect(star.x, star.y, star.size, star.size);
                ctx.restore();
            }

            // 2. Margens e Terreno Gótico com gradiente psicodélico liquid fire
            ctx.save();
            const landGradient = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
            landGradient.addColorStop(0, '#150524');
            landGradient.addColorStop(0.5, '#0a0212');
            landGradient.addColorStop(1, '#1b0210');
            ctx.fillStyle = landGradient;

            // Margem Esquerda
            ctx.strokeStyle = '#ff0055';
            ctx.lineWidth = 4;
            ctx.shadowBlur = 20;
            ctx.shadowColor = '#ff5500';

            ctx.beginPath();
            ctx.moveTo(0, 0);
            for (let y = 0; y <= canvas.height; y += 10) {
                const limits = getRiverLimits(y);
                ctx.lineTo(limits.left, y);
            }
            ctx.lineTo(0, canvas.height);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            // Margem Direita
            ctx.strokeStyle = '#00f3ff';
            ctx.shadowColor = '#00f3ff';
            ctx.beginPath();
            ctx.moveTo(canvas.width, 0);
            for (let y = 0; y <= canvas.height; y += 10) {
                const limits = getRiverLimits(y);
                ctx.lineTo(limits.right, y);
            }
            ctx.lineTo(canvas.width, canvas.height);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
            ctx.restore();

            // 3. Grade Neon/Líquida do Rio
            ctx.save();
            ctx.strokeStyle = 'rgba(255, 85, 0, 0.22)';
            ctx.lineWidth = 1.5;
            const gridOffset = distanceY % 45;
            for (let y = gridOffset; y < canvas.height; y += 45) {
                const limits = getRiverLimits(y);
                ctx.beginPath();
                ctx.moveTo(limits.left, y);
                ctx.lineTo(limits.right, y);
                ctx.stroke();
            }
            ctx.restore();

            // 4. Espirais e Torres Góticas Líquidas nas Margens
            for (let sp of bankSpires) {
                ctx.save();
                ctx.strokeStyle = sp.color;
                ctx.shadowBlur = 14;
                ctx.shadowColor = sp.color;
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(sp.x, sp.y);
                ctx.lineTo(sp.x - 10, sp.y + sp.height);
                ctx.lineTo(sp.x + 10, sp.y + sp.height);
                ctx.closePath();
                ctx.stroke();
                ctx.restore();
            }

            // 5. Pontes Tecnológicas Góticas
            for (let br of bridges) {
                ctx.save();
                if (!br.destroyed) {
                    ctx.fillStyle = '#18022d';
                    ctx.strokeStyle = '#ff5500';
                    ctx.shadowBlur = 25;
                    ctx.shadowColor = '#ff5500';
                    ctx.lineWidth = 4;
                    ctx.fillRect(0, br.y - br.height / 2, canvas.width, br.height);
                    ctx.strokeRect(0, br.y - br.height / 2, canvas.width, br.height);

                    ctx.fillStyle = '#00f3ff';
                    ctx.shadowColor = '#00f3ff';
                    ctx.fillRect(canvas.width / 2 - 50, br.y - 7, 100, 14);
                } else {
                    ctx.strokeStyle = 'rgba(255, 85, 0, 0.5)';
                    ctx.lineWidth = 2;
                    ctx.strokeRect(0, br.y - 6, canvas.width * 0.32, 12);
                    ctx.strokeRect(canvas.width * 0.68, br.y - 6, canvas.width * 0.32, 12);
                }
                ctx.restore();
            }

            // 6. Minas Flutuantes Pulsantes
            for (let m of mines) {
                ctx.save();
                ctx.strokeStyle = '#ffea00';
                ctx.fillStyle = 'rgba(255, 234, 0, 0.35)';
                ctx.shadowBlur = 15 + Math.sin(m.pulse) * 8;
                ctx.shadowColor = '#ffea00';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(m.x, m.y, m.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();

                ctx.beginPath();
                ctx.moveTo(m.x - 18, m.y); ctx.lineTo(m.x + 18, m.y);
                ctx.moveTo(m.x, m.y - 18); ctx.lineTo(m.x, m.y + 18);
                ctx.stroke();
                ctx.restore();
            }

            // 7. Cristais de Escudo Magnético
            for (let s of shieldItems) {
                ctx.save();
                ctx.strokeStyle = '#00f3ff';
                ctx.fillStyle = 'rgba(0, 243, 255, 0.35)';
                ctx.shadowBlur = 18;
                ctx.shadowColor = '#00f3ff';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(s.x, s.y - s.size);
                ctx.lineTo(s.x + s.size, s.y);
                ctx.lineTo(s.x, s.y + s.size);
                ctx.lineTo(s.x - s.size, s.y);
                ctx.closePath();
                ctx.fill();
                ctx.stroke();
                ctx.restore();
            }

            // 8. Cânisteres de Combustível (Liquid Fire)
            for (let f of fuelCells) {
                ctx.save();
                ctx.fillStyle = 'rgba(0, 255, 102, 0.25)';
                ctx.strokeStyle = '#00ff66';
                ctx.shadowBlur = 18;
                ctx.shadowColor = '#00ff66';
                ctx.lineWidth = 2;
                ctx.fillRect(f.x - f.width / 2, f.y - f.height / 2, f.width, f.height);
                ctx.strokeRect(f.x - f.width / 2, f.y - f.height / 2, f.width, f.height);

                ctx.fillStyle = '#00ff66';
                ctx.font = 'bold 11px Orbitron';
                ctx.fillText('FUEL', f.x - 16, f.y + 4);
                ctx.restore();
            }

            // 9. Inimigos (Gráficos SVG Maiores e Mais Aprimorados)
            for (let e of enemies) {
                ctx.save();
                ctx.translate(e.x, e.y);
                ctx.shadowBlur = 16;
                if (e.type === 'cyborg_fighter') {
                    // Caça Cibernético Aprimorado
                    ctx.strokeStyle = '#ff0055';
                    ctx.shadowColor = '#ff0055';
                    ctx.fillStyle = 'rgba(255, 0, 85, 0.35)';
                    ctx.lineWidth = 2.5;

                    ctx.beginPath();
                    ctx.moveTo(0, -18);
                    ctx.lineTo(18, 16);
                    ctx.lineTo(6, 10);
                    ctx.lineTo(0, 16);
                    ctx.lineTo(-6, 10);
                    ctx.lineTo(-18, 16);
                    ctx.closePath();
                    ctx.fill();
                    ctx.stroke();
                } else {
                    // Gárgula de Plasma Rotativo
                    ctx.rotate(e.angle);
                    ctx.strokeStyle = '#9d00ff';
                    ctx.shadowColor = '#9d00ff';
                    ctx.fillStyle = 'rgba(157, 0, 255, 0.45)';
                    ctx.lineWidth = 2.5;

                    ctx.beginPath();
                    ctx.arc(0, 0, 18, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.stroke();

                    // Detalhes internos
                    ctx.strokeStyle = '#00f3ff';
                    ctx.beginPath();
                    ctx.moveTo(-12, -12); ctx.lineTo(12, 12);
                    ctx.moveTo(12, -12); ctx.lineTo(-12, 12);
                    ctx.stroke();
                }
                ctx.restore();
            }

            // 10. Balas / Plasma Líquido
            ctx.save();
            ctx.fillStyle = '#00f3ff';
            ctx.shadowBlur = 16;
            ctx.shadowColor = '#00f3ff';
            for (let b of bullets) {
                ctx.fillRect(b.x - b.width / 2, b.y - b.height / 2, b.width, b.height);
            }
            ctx.restore();

            // 11. Nave do Jogador (Maior, Detalhada e Estilizada Cyberpunk Neon)
            if (gameRunning) {
                ctx.save();
                ctx.translate(player.x, player.y);
                ctx.rotate(player.vx * 0.04);

                if (shieldTime > 0) {
                    ctx.strokeStyle = '#ffea00';
                    ctx.shadowBlur = 25;
                    ctx.shadowColor = '#ffea00';
                    ctx.lineWidth = 2.5;
                    ctx.beginPath();
                    ctx.arc(0, 0, 36, 0, Math.PI * 2);
                    ctx.stroke();
                }

                // Asas e fuselagem principal (Vetores SVG Customizados)
                ctx.shadowBlur = 22;
                ctx.shadowColor = '#00f3ff';
                ctx.strokeStyle = '#00f3ff';
                ctx.fillStyle = 'rgba(12, 4, 24, 0.85)';
                ctx.lineWidth = 2.5;

                ctx.beginPath();
                ctx.moveTo(0, -26);
                ctx.lineTo(22, 20);
                ctx.lineTo(8, 12);
                ctx.lineTo(0, 24);
                ctx.lineTo(-8, 12);
                ctx.lineTo(-22, 20);
                ctx.closePath();
                ctx.fill();
                ctx.stroke();

                // Núcleo de Fogo Líquido Central
                ctx.fillStyle = '#ff5500';
                ctx.shadowColor = '#ff5500';
                ctx.beginPath();
                ctx.moveTo(0, -12);
                ctx.lineTo(6, 6);
                ctx.lineTo(0, 14);
                ctx.lineTo(-6, 6);
                ctx.closePath();
                ctx.fill();

                // Propulsor traseiro piscante
                ctx.fillStyle = '#00ff66';
                ctx.shadowColor = '#00ff66';
                ctx.beginPath();
                ctx.arc(0, 22, Math.random() * 3 + 3, 0, Math.PI * 2);
                ctx.fill();

                ctx.restore();
            }

            // 12. Partículas
            for (let p of particles) {
                ctx.save();
                ctx.globalAlpha = p.life;
                ctx.fillStyle = p.color;
                ctx.shadowBlur = 12;
                ctx.shadowColor = p.color;
                ctx.fillRect(p.x, p.y, p.size, p.size);
                ctx.restore();
            }

            requestAnimationFrame(() => {
                update();
                render();
            });
        }

        function initGame() {
            score = 0;
            level = 1;
            lives = 3;
            fuel = 100;
            shieldTime = 0;
            distanceY = 0;
            enemies = [];
            bullets = [];
            fuelCells = [];
            shieldItems = [];
            mines = [];
            bridges = [];
            particles = [];
            bankSpires = [];
            resetPlayer();
            updateHUD();
            gameRunning = true;
        }

        document.getElementById('startBtn').addEventListener('click', () => {
            document.getElementById('startOverlay').classList.add('hidden');
            initGame();
        });

        document.getElementById('restartBtn').addEventListener('click', () => {
            document.getElementById('gameOverOverlay').classList.add('hidden');
            initGame();
        });

        render();
    </script>

.mobile-raid-controls{display:none;position:fixed;inset:auto 0 max(10px,env(safe-area-inset-bottom)) 0;z-index:9999;justify-content:center;gap:14px;pointer-events:none}.mobile-raid-controls button{pointer-events:auto;width:68px;height:58px;border-radius:14px;border:2px solid #00f3ff;background:rgba(3,1,8,.82);color:#fff;font-size:28px;font-weight:900;box-shadow:0 0 18px rgba(0,243,255,.35);touch-action:none}@media(max-width:760px),(pointer:coarse){.mobile-raid-controls{display:flex}.game-wrapper{transform:scale(.72);transform-origin:center center;max-width:138vw}.hud-panel{width:180px}.controls-hint{display:none}}
</style>
